name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  wl-static-check:
    name: Wolfram Language static check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Bracket balance, nested comments, unterminated strings, BeginPackage/EndPackage pairs.
      # The full test suite needs a Wolfram kernel: wolframscript -file tools/run_tests.wls
      - name: Static-check all Wolfram Language sources
        run: python tools/wl_syntax_check.py Kernel/*.wl PacletInfo.wl Tests/*.wlt tools/*.wls Data/Skyrme/*.wl

  python-reference:
    name: ScalarND Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy and SciPy
        run: python -m pip install numpy scipy
      # Recomputes both bounds of every stored certificate from its exact data (a certificate whose .npz file is
      # not in the repository is reported as skipped) and compares the interval evaluator with exact rational
      # arithmetic.  check_theorem.py (8 to 15 minutes) is run by hand.
      - name: Recompute the stored certificates
        working-directory: Reference/ScalarND
        run: python verify_all.py
      - name: Exact cross-check of the rigorous evaluators
        working-directory: Reference/ScalarND
        run: python check_exact.py

  python-reference-magnetisation:
    name: Magnetisation Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy and SciPy
        run: python -m pip install numpy scipy
      # Exact check of the dual certificates against known minima, falsification, and the certified competitor
      # (known answers, an independent quadrature, stored lower bounds below competitor energies).  Under a minute.
      - name: Dual certificates
        working-directory: Reference/Magnetisation
        run: python check_dual.py
      - name: Certified competitor
        working-directory: Reference/Magnetisation
        run: python check_competitor.py

  python-reference-elasticity:
    name: Elasticity Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy and SciPy
        run: python -m pip install numpy scipy
      # Recomputes both bounds of every stored certificate from its exact data, rebuilds the fields in exact rational
      # arithmetic (static admissibility, both exact values inside the enclosures), and runs the known-answer and
      # falsification tests.  Under a minute in all.
      - name: Recompute the stored certificates
        working-directory: Reference/Elasticity
        run: python verify_all.py
      - name: Exact cross-check of the rigorous evaluators
        working-directory: Reference/Elasticity
        run: python check_exact.py
      - name: Known minima and falsification
        working-directory: Reference/Elasticity
        run: python check_theorem.py

  data-integrity:
    name: Shipped grid data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every grid directory has its five files and valid metadata
        run: |
          set -e
          for d in Data/Skyrme/mu*_*/; do
            for f in meta.json taus.f64 vref.f64 eug.f64 offs.i64; do test -s "$d$f" || { echo "missing $d$f"; exit 1; }; done
            jq -e '.python_reference.certified_lower_bound' "$d/meta.json" > /dev/null
          done
          echo "grid data OK"
